<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Apartmán ve vile Litomyšl</title>
<meta name="description" content="Útulný apartmán ve vile v Litomyšli.">
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<style>
:root{--bg:#f8f3ea;--ink:#24211d;--muted:#6c6359;--green:#14543d;--green2:#0e3f2d;--line:#e5dccd;--shadow:0 16px 40px rgba(37,30,20,.10)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;line-height:1.06;margin:0}p{line-height:1.75;color:var(--muted)}.wrap{max-width:1180px;margin:auto;padding:0 22px}
header{position:sticky;top:0;z-index:10;background:rgba(248,243,234,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}.nav{height:72px;display:flex;align-items:center;justify-content:space-between;gap:18px}.brand{font-weight:850;text-decoration:none;color:var(--ink)}.links{display:flex;gap:18px;font-size:14px}.links a{text-decoration:none;color:var(--muted)}.adminlink{border-radius:999px;background:#fff;padding:8px 11px;text-decoration:none;color:var(--muted)}
.hero{min-height:78vh;position:relative;display:flex;align-items:center;color:#fff;overflow:hidden}.hero:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.72),rgba(0,0,0,.30),rgba(0,0,0,.05));z-index:1}.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.hero .inner{position:relative;z-index:2;max-width:760px;padding:110px 0}.badge{display:inline-flex;border-radius:999px;background:rgba(255,255,255,.18);padding:10px 15px;margin-bottom:22px}h1{font-size:clamp(42px,8vw,82px);letter-spacing:-.045em}.hero p{font-size:clamp(18px,2vw,22px);color:rgba(255,255,255,.9)}.btns{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}.btn{display:inline-block;text-decoration:none;border-radius:18px;padding:15px 22px;font-weight:850}.primary{background:var(--green);color:#fff}.light{background:#fff;color:var(--ink)}
section{padding:78px 0}.grid2{display:grid;grid-template-columns:1.05fr .95fr;gap:42px;align-items:start}.kicker{text-transform:uppercase;letter-spacing:.18em;color:var(--green);font-weight:900;font-size:13px;margin-bottom:12px}h2{font-size:clamp(34px,5vw,54px);letter-spacing:-.035em}.lead{font-size:18px}.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}.chip{background:#fff;border-radius:999px;padding:10px 14px;box-shadow:var(--shadow);font-size:14px;color:#5b534a}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.card,.price{background:#fff;border:1px solid var(--line);border-radius:28px;padding:24px;box-shadow:var(--shadow)}.icon{font-size:28px;margin-bottom:12px}.ops{background:var(--green2);border-radius:34px;padding:26px;display:grid;grid-template-columns:repeat(4,1fr);gap:14px;color:#fff}.op{background:rgba(255,255,255,.1);border-radius:24px;padding:18px;font-weight:750}.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.gallery img{width:100%;height:275px;object-fit:cover;border-radius:28px;box-shadow:var(--shadow)}.gallery img:first-child{grid-column:span 2}.white{background:#fff}.price-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.price{background:var(--bg);box-shadow:none}.price small{text-transform:uppercase;letter-spacing:.18em;color:var(--muted);font-weight:800}.price strong{display:block;font-size:42px;margin-top:8px}
.calendar-grid,.reviews{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.num{display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:999px;background:var(--green);color:#fff;font-weight:900;margin-bottom:16px}.month{background:#fff;border-radius:28px;padding:18px;box-shadow:var(--shadow);border:1px solid var(--line)}.month-title{font-weight:900;margin-bottom:12px;text-transform:capitalize}.week,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}.week{font-size:12px;color:var(--muted);margin-bottom:8px}.day{aspect-ratio:1/1;border:1px solid var(--line);border-radius:12px;display:flex;align-items:center;justify-content:center;background:#fff;font-size:13px;cursor:pointer}.day.disabled{background:#eee8dc;color:#b4aa9e;cursor:not-allowed}.day.selected{background:var(--green);color:#fff}.day.range{background:#dbece3}
.reservation{background:var(--green2);color:#fff}form{background:#fff;color:var(--ink);border-radius:36px;padding:32px;box-shadow:var(--shadow)}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px;margin-top:24px}label span{display:block;margin-bottom:6px;font-size:14px;color:#5b534a;font-weight:800}input,textarea{width:100%;border:1px solid var(--line);border-radius:18px;padding:13px 14px;font:inherit}.wide{grid-column:1/-1}.check{display:flex;gap:10px;font-size:14px;color:#5b534a;margin:10px 0}.check input{width:auto}.submit{width:100%;border:0;border-radius:18px;background:var(--green);color:#fff;padding:16px;font-weight:900;font-size:16px;cursor:pointer;margin-top:18px}.summary{background:rgba(255,255,255,.1);border-radius:36px;padding:32px;position:sticky;top:96px}.sum-row{display:flex;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.16);padding:13px 0}.sum-row.big{font-size:22px;font-weight:900}.notice{margin-top:16px;border-radius:18px;padding:14px;background:#ecf7f1;color:#0e5a3c}.nearby{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.mapbox{overflow:hidden;border-radius:34px;border:1px solid var(--line);box-shadow:var(--shadow)}iframe{border:0;width:100%;height:430px}footer{background:#fff;border-top:1px solid var(--line);padding:28px 0;color:var(--muted);font-size:14px}.foot{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}.small{font-size:13px;color:var(--muted)}
@media(max-width:900px){.links{display:none}.grid2,.calendar-grid,.steps,.ops{grid-template-columns:1fr}.cards,.price-grid,.nearby,.reviews{grid-template-columns:1fr}.gallery{grid-template-columns:1fr}.gallery img:first-child{grid-column:auto}.form-grid{grid-template-columns:1fr}.summary{position:static}}
</style>
</head>
<body>
<header><div class="wrap nav"><a class="brand" id="brand" href="#top">Apartmán ve vile Litomyšl</a><nav class="links"><a href="#apartment">Apartmán</a><a href="#gallery">Galerie</a><a href="#prices">Ceny</a><a href="#availability">Dostupnost</a><a href="#reservation">Rezervace</a><a href="#contact">Kontakt</a></nav><a class="adminlink" href="/admin/">Admin</a></div></header>
<main id="app">Načítám…</main>
<footer><div class="wrap foot"><div>© <span id="year"></span> <span id="footName">Apartmán ve vile Litomyšl</span>. Chalupy Krkonoše s.r.o.</div><div>Obchodní podmínky a ochranu osobních údajů doplníme v další fázi.</div></div></footer>
<script>
let data,selectedStart='',selectedEnd='';year.textContent=new Date().getFullYear();
fetch('/data/site.json?v='+Date.now()).then(r=>r.json()).then(d=>{data=d;renderSite();});
function renderSite(){brand.textContent=data.siteName;footName.textContent=data.siteName;document.title=data.siteName;
app.innerHTML=`<section class="hero"><img src="${data.hero.image}"><div class="wrap"><div class="inner"><div class="badge">✓ ${esc(data.hero.badge)}</div><h1>${esc(data.hero.title)}</h1><p>${esc(data.hero.text)}</p><div class="btns"><a class="btn primary" href="#reservation">Odeslat poptávku</a><a class="btn light" href="#availability">Ověřit dostupnost</a></div></div></div></section>
<section id="apartment"><div class="wrap grid2"><div><div class="kicker">${esc(data.intro.kicker)}</div><h2>${esc(data.intro.title)}</h2><p class="lead">${esc(data.intro.text)}</p><div class="chips"><span class="chip">📍 ${esc(data.contact.address)}</span><span class="chip">🕒 Check-in 15:00 / Check-out 10:00</span></div></div><div class="cards">${data.amenities.map(a=>`<div class="card"><div class="icon">${esc(a.icon)}</div><strong>${esc(a.title)}</strong></div>`).join('')}</div></div></section>
<section style="padding-top:0"><div class="wrap"><div class="ops"><div class="op">🕒 Check-in 15:00</div><div class="op">🕙 Check-out 10:00</div><div class="op">💳 Záloha ${data.pricing.depositPercent} % / 5 dnů</div><div class="op">📄 Doplatek týden před příjezdem</div></div></div></section>
<section id="gallery"><div class="wrap"><h2>Fotogalerie</h2><p class="small">Reálné fotografie apartmánu a zahrady.</p><div class="gallery">${data.gallery.map(g=>`<img src="${g.image}" alt="${esc(g.alt)}" loading="lazy">`).join('')}</div></div></section>
<section class="white" id="prices"><div class="wrap grid2"><div><h2>Ceny</h2><p class="lead">Základ je ${data.pricing.baseEur} € za noc, víkendové noci mají příplatek ${data.pricing.weekendSurchargePercent} % a u vícedenních pobytů se sleva navyšuje až na ${data.pricing.discountNight5Plus} % za noc.</p></div><div class="price-grid"><div class="price"><small>Základ</small><strong>${data.pricing.baseEur} €</strong><div class="small">standardní cena / noc</div></div><div class="price"><small>Víkend</small><strong>+${data.pricing.weekendSurchargePercent} %</strong><div class="small">pátek a sobota</div></div><div class="card" style="grid-column:1/-1;box-shadow:none"><strong>Vícedenní pobyty</strong><p class="small">Slevy: ${data.pricing.discountNight1} %, ${data.pricing.discountNight2} %, ${data.pricing.discountNight3} %, ${data.pricing.discountNight4} %, ${data.pricing.discountNight5Plus} % pro 5. a další noc.</p><strong>Místní poplatek</strong><p class="small">${data.pricing.cityTaxCzkAdultNight} Kč / dospělá osoba / noc.</p></div></div></div></section>
<section><div class="wrap"><h2>Jak funguje přímá rezervace</h2><p class="lead">Rezervace přes tento web je levnější, ale stále ručně potvrzovaná.</p><div class="steps"><div class="card"><div class="num">1</div><h3>Odešlete poptávku</h3><p class="small">Vyberete termín, počet osob a vyplníte kontaktní údaje.</p></div><div class="card"><div class="num">2</div><h3>Ověříme dostupnost</h3><p class="small">Poptávku zkontrolujeme a potvrdíme.</p></div><div class="card"><div class="num">3</div><h3>Pošleme zálohu</h3><p class="small">Po schválení obdržíte platební údaje.</p></div><div class="card"><div class="num">4</div><h3>Rezervaci potvrdíme</h3><p class="small">Termín je potvrzený po úhradě zálohy.</p></div></div></div></section>
<section id="availability" style="padding-top:0"><div class="wrap"><h2>Kalendář termínu</h2><p class="lead">Kalendář slouží k výběru termínu a výpočtu ceny. Dostupnost potvrdíme e-mailem.</p><div class="calendar-grid" id="calendar"></div></div></section>
<section class="reservation" id="reservation"><div class="wrap grid2"><form id="bookingForm" action="https://formsubmit.co/${escAttr(data.reservation.formEmail)}" method="POST"><input type="hidden" name="_subject" value="Nová poptávka z webu Apartmán ve vile Litomyšl"><input type="hidden" name="_cc" value="${escAttr(data.reservation.ccEmail)}"><input type="hidden" name="_template" value="table"><input type="hidden" name="_captcha" value="false"><input type="hidden" name="_next" value="https://${escAttr(data.domain)}/#reservation"><input type="text" name="_honey" style="display:none"><input type="hidden" name="Souhrn ceny" id="priceSummaryField"><h2>Rezervační poptávka</h2><p class="lead">${esc(data.reservation.text)}</p><div class="form-grid"><label><span>Jméno</span><input name="Jméno" required></label><label><span>Příjmení</span><input name="Příjmení" required></label><label><span>E-mail</span><input type="email" name="E-mail" required></label><label><span>Telefon</span><input name="Telefon" required></label><label><span>Země</span><input name="Země" value="Česká republika" required></label><label><span>Fakturační adresa</span><input name="Fakturační adresa"></label><label><span>Příjezd</span><input type="date" name="Příjezd" id="checkIn" required></label><label><span>Odjezd</span><input type="date" name="Odjezd" id="checkOut" required></label><label><span>Dospělí</span><input type="number" name="Dospělí" id="adults" min="1" max="4" value="2" required></label><label><span>Děti</span><input type="number" name="Děti" id="children" min="0" max="4" value="0"></label><label class="wide"><span>Poznámka</span><textarea name="Poznámka" rows="4"></textarea></label></div><label class="check"><input type="checkbox" name="Souhlas GDPR" value="ano" required>Souhlasím se zpracováním osobních údajů.</label><label class="check"><input type="checkbox" name="Pravidla pobytu" value="ano" required>Beru na vědomí pravidla pobytu.</label><div id="formNotice"></div><button class="submit">Odeslat poptávku e-mailem</button></form><aside class="summary"><h2>Souhrn ceny</h2><div class="sum-row"><span>Počet nocí</span><strong id="sumNights">0</strong></div><div class="sum-row"><span>Ubytování</span><strong id="sumAccommodation">0 €</strong></div><div class="sum-row"><span>Místní poplatek</span><strong id="sumTax">0 Kč</strong></div><div class="sum-row big"><span>Celkem</span><strong id="sumTotal">0 €</strong></div><div class="sum-row"><span>Záloha ${data.pricing.depositPercent} %</span><strong id="sumDeposit">0 €</strong></div><div class="sum-row"><span>Doplatek</span><strong id="sumBalance">0 €</strong></div><p class="small" style="color:rgba(255,255,255,.75)">Doplatek je splatný týden před příjezdem.</p></aside></div></section>
<section><div class="wrap grid2"><div><div class="kicker">Litomyšl</div><h2>${esc(data.nearby.title)}</h2><p class="lead">${esc(data.nearby.text)}</p></div><div class="nearby">${data.nearby.items.map(i=>`<div class="card">${esc(i.icon)} <strong>${esc(i.title)}</strong></div>`).join('')}</div></div></section>
<section id="contact"><div class="wrap grid2"><div><h2>Kontakt a provozovatel</h2><p>📍 ${esc(data.contact.address)}</p><p>✉️ ${esc(data.contact.email)}</p><p>☎️ ${esc(data.contact.phone)}</p><div class="card"><strong>${esc(data.contact.company)}</strong><br>IČO: ${esc(data.contact.ico)}<br>DIČ: ${esc(data.contact.dic)}<br>Sídlo: ${esc(data.contact.companyAddress)}</div><div class="btns"><a class="btn primary" href="${escAttr(data.contact.mapUrl)}" target="_blank">Otevřít mapu</a><a class="btn light" href="${escAttr(data.contact.bookingUrl)}" target="_blank">Booking.com</a></div></div><div class="mapbox"><iframe title="Mapa" src="https://www.google.com/maps?q=9.%20kv%C4%9Btna%20785%20Litomy%C5%A1l&output=embed" loading="lazy"></iframe></div></div></section>`;
initCalculator();}
function initCalculator(){const ci=document.getElementById('checkIn'),co=document.getElementById('checkOut'),a=document.getElementById('adults'),c=document.getElementById('children'),f=document.getElementById('bookingForm');ci.value=iso(addDays(new Date(),14));co.value=iso(addDays(new Date(),16));selectedStart=ci.value;selectedEnd=co.value;['input','change'].forEach(ev=>{ci.addEventListener(ev,calc);co.addEventListener(ev,calc);a.addEventListener(ev,calc);c.addEventListener(ev,calc)});f.addEventListener('submit',e=>{calc();if(Number(a.value||0)+Number(c.value||0)>4||nights()<1){e.preventDefault();alert('Zkontrolujte prosím termín a počet osob.')}});calc();}
function iso(d){return d.toISOString().slice(0,10)}function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}function nights(){return Math.max(0,Math.round((new Date(checkOut.value)-new Date(checkIn.value))/86400000)||0)}function eur(v){return new Intl.NumberFormat('cs-CZ',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(v||0)}function czk(v){return new Intl.NumberFormat('cs-CZ',{style:'currency',currency:'CZK',maximumFractionDigits:0}).format(v||0)}function isW(d){const x=new Date(d+'T12:00:00').getDay();return x===5||x===6}function addIso(s,n){const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return iso(d)}function disc(i){const p=data.pricing;if(i===0)return p.discountNight1/100;if(i===1)return p.discountNight2/100;if(i===2)return p.discountNight3/100;if(i===3)return p.discountNight4/100;return p.discountNight5Plus/100}
function accommodation(){let total=0,lines=[];for(let i=0;i<nights();i++){const date=addIso(checkIn.value,i),sur=isW(date)?data.pricing.weekendSurchargePercent/100:0,di=disc(i),price=data.pricing.baseEur*(1+sur)*(1-di);total+=price;lines.push(date+': '+eur(price));}return{total,lines}}
function calc(){selectedStart=checkIn.value;selectedEnd=checkOut.value;const n=nights(),ad=Number(adults.value||0),ch=Number(children.value||0),ac=accommodation(),taxC=ad*n*data.pricing.cityTaxCzkAdultNight,taxE=taxC/data.pricing.eurToCzk,total=ac.total+taxE,dep=Math.round(total*data.pricing.depositPercent/100);sumNights.textContent=n;sumAccommodation.textContent=eur(ac.total);sumTax.textContent=czk(taxC)+' / cca '+eur(taxE);sumTotal.textContent=eur(total);sumDeposit.textContent=eur(dep);sumBalance.textContent=eur(total-dep);priceSummaryField.value=['Počet nocí: '+n,'Ubytování: '+eur(ac.total),'Místní poplatek: '+czk(taxC),'Celkem: '+eur(total),'Záloha: '+eur(dep),'Doplatek: '+eur(total-dep),'Rozpis: '+ac.lines.join(' | ')].join(' | ');formNotice.innerHTML='<div class="notice">'+(ad+ch>4?'Maximální kapacita apartmánu je 4 osoby.':'Dostupnost ručně potvrdíme e-mailem.')+'</div>';renderCalendar()}
function renderCalendar(){const root=document.getElementById('calendar');if(!root)return;root.innerHTML='';const start=new Date();start.setDate(1);const today=iso(new Date());for(let m=0;m<6;m++){const date=new Date(start.getFullYear(),start.getMonth()+m,1),days=new Date(date.getFullYear(),date.getMonth()+1,0).getDate(),first=(date.getDay()+6)%7,month=document.createElement('div');month.className='month';month.innerHTML='<div class="month-title">'+new Intl.DateTimeFormat('cs-CZ',{month:'long',year:'numeric'}).format(date)+'</div><div class="week"><div>Po</div><div>Út</div><div>St</div><div>Čt</div><div>Pá</div><div>So</div><div>Ne</div></div>';const grid=document.createElement('div');grid.className='days';for(let i=0;i<first;i++)grid.appendChild(document.createElement('div'));for(let d=1;d<=days;d++){const dt=iso(new Date(date.getFullYear(),date.getMonth(),d)),cell=document.createElement('div');const past=dt<today,inR=selectedStart&&selectedEnd&&dt>=selectedStart&&dt<selectedEnd,edge=dt===selectedStart||dt===selectedEnd;cell.className='day '+(past?'disabled ':'')+(inR?'range ':'')+(edge?'selected ':'');cell.textContent=d;if(!past)cell.onclick=()=>{if(!selectedStart||selectedEnd){selectedStart=dt;selectedEnd='';checkIn.value=dt;checkOut.value=''}else if(dt>selectedStart){selectedEnd=dt;checkOut.value=dt}else{selectedStart=dt;selectedEnd='';checkIn.value=dt;checkOut.value=''}calc()};grid.appendChild(cell)}month.appendChild(grid);root.appendChild(month)}}
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function escAttr(s){return esc(s).replace(/'/g,'&#39;')}
</script></body></html>
